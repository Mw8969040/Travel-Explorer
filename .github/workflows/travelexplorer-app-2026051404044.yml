name: Build and deploy .NET application to container app travelexplorer-app-2026051404044
on:
  push:
    branches:
    - master
permissions:
  id-token: write
  contents: read
env:
  CONTAINER_APP_CONTAINER_NAME: travelexplorer
  CONTAINER_APP_NAME: travelexplorer-app-2026051404044
  CONTAINER_APP_RESOURCE_GROUP_NAME: CarPrice_RG
  CONTAINER_REGISTRY_LOGIN_SERVER: travelexplorer20260514030654.azurecr.io
  DOCKER_FILE_PATH: Travel Explorer/Dockerfile
  PROJECT_NAME_FOR_DOCKER: travel explorer
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.TravelExplorer20260514030654_USERNAME_1BFB }}
        password: ${{ secrets.TravelExplorer20260514030654_PASSWORD_1BFB }}
    - name: Build and push container image to registry
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
        file: ${{ env.DOCKER_FILE_PATH }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.travelexplorer_app_2026051404044_CLIENT_ID_1BFB }}
        tenant-id: ${{ vars.travelexplorer_app_2026051404044_TENANT_ID_1BFB }}
        subscription-id: ${{ vars.travelexplorer_app_2026051404044_SUBSCRIPTION_ID_1BFB }}
    - name: Deploy to containerapp
      uses: azure/CLI@v2
      with:
        inlineScript: >
          az config set extension.use_dynamic_install=yes_without_prompt

          az containerapp registry set --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --server ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }} --username ${{ secrets.TravelExplorer20260514030654_USERNAME_1BFB }} --password ${{ secrets.TravelExplorer20260514030654_PASSWORD_1BFB }}

          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --container-name ${{ env.CONTAINER_APP_CONTAINER_NAME }} --resource-group ${{ env.CONTAINER_APP_RESOURCE_GROUP_NAME }} --image ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.PROJECT_NAME_FOR_DOCKER }}:${{ github.sha }}
    - name: logout
      run: >
        az logout
